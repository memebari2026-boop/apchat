<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#030712">
<title>APCHAT — Global Messenger</title>
<link rel="manifest" href="./manifest.json">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#030712;color:#f9fafb;font-family:Arial,sans-serif;height:100dvh;overflow:hidden;-webkit-tap-highlight-color:transparent}
.hidden{display:none!important}button{cursor:pointer}input,select,textarea{outline:none}.brand{background:linear-gradient(120deg,#2563eb,#7c3aed)}
#authScreen,#app{height:100dvh;width:100%;overflow:hidden}#sidebar{width:100%;max-width:420px}
@media(min-width:700px){#sidebar{width:350px}}
#apStories{display:flex;gap:12px;overflow-x:auto;padding:12px;border-bottom:1px solid #1f2937;min-height:94px}
.apStory{flex:0 0 66px;text-align:center;font-size:11px;color:#d1d5db;overflow:hidden}
.apStory img{width:55px;height:55px;border-radius:50%;object-fit:cover;border:3px solid #8b5cf6;padding:2px}
#storyModal{position:fixed;inset:0;background:#000e;z-index:1000;display:flex;align-items:center;justify-content:center;padding:18px}
#storyModal img{max-width:100%;max-height:75vh;object-fit:contain;border-radius:12px}
#messagesContainer{overflow-y:auto}
</style>
</head>
<body>
<section id="authScreen" class="flex items-center justify-center p-4 bg-gray-950">
 <div class="w-full max-w-md bg-gray-900 border border-gray-800 rounded-3xl p-6 shadow-2xl">
  <div class="text-center mb-7"><div class="w-16 h-16 rounded-2xl brand flex items-center justify-center text-white text-3xl font-black mx-auto mb-4">AP</div><h1 class="text-3xl font-black text-blue-500">APCHAT</h1><p class="text-xs text-gray-400 mt-1">Global Real-Time Messenger</p></div>
  <div id="viewLogin" class="space-y-4"><h2 class="text-xl font-bold text-center">Login</h2>
   <input id="loginPhone" type="tel" placeholder="Mobile Number" class="w-full bg-gray-800 p-3 rounded-xl text-sm">
   <input id="loginPassword" type="password" placeholder="Password" class="w-full bg-gray-800 p-3 rounded-xl text-sm">
   <button id="loginBtn" onclick="handleLogin()" class="w-full py-3 brand rounded-xl font-bold">Login</button>
   <p class="text-center text-sm text-gray-400">Don't have an account? <button onclick="switchAuthView('register')" class="text-blue-400 underline">Create Account</button></p>
  </div>
  <div id="viewRegister" class="space-y-3 hidden"><h2 class="text-xl font-bold text-center">Create Account</h2>
   <input id="regName" maxlength="40" placeholder="Full Name" class="w-full bg-gray-800 p-3 rounded-xl text-sm">
   <input id="regHandle" maxlength="24" placeholder="Unique APCHAT ID (abdullah786)" class="w-full bg-gray-800 p-3 rounded-xl text-sm">
   <input id="regPhone" type="tel" placeholder="Mobile Number" class="w-full bg-gray-800 p-3 rounded-xl text-sm">
   <input id="regPassword" type="password" placeholder="Password (minimum 6 characters)" class="w-full bg-gray-800 p-3 rounded-xl text-sm">
   <select id="regPrivacy" class="w-full bg-gray-800 p-3 rounded-xl text-sm"><option value="public">Public Account</option><option value="private">Private Account</option></select>
   <button id="registerBtn" onclick="handleRegister()" class="w-full py-3 brand rounded-xl font-bold">Register Account</button>
   <p class="text-center text-sm text-gray-400">Already have an account? <button onclick="switchAuthView('login')" class="text-blue-400 underline">Login</button></p>
  </div>
  <p id="authStatus" class="text-center text-xs text-red-400 mt-4"></p>
  <p class="text-center text-[10px] text-gray-500 mt-3">OTP disabled: phone ownership is not verified.</p>
 </div>
</section>
<section id="app" class="hidden flex bg-gray-950">
 <aside id="sidebar" class="bg-gray-900 border-r border-gray-800 flex flex-col h-full">
  <header class="p-3 border-b border-gray-800 flex justify-between items-center gap-2">
   <div class="flex items-center gap-2 min-w-0"><div class="w-10 h-10 rounded-xl brand flex items-center justify-center font-black text-xl">AP</div><div class="min-w-0"><h1 class="text-xl font-black text-blue-400">APCHAT</h1><p id="currentUserNameDisplay" class="text-xs text-gray-400 truncate">Online</p></div></div>
   <div class="flex items-center gap-1"><button onclick="chooseProfilePhoto()" class="p-1 text-blue-300" title="Profile photo"><img id="myAvatar" class="w-9 h-9 rounded-full object-cover" alt="Profile"></button><button onclick="togglePrivacySettings()" class="p-2 text-gray-300"><i data-lucide="settings"></i></button><button onclick="logout()" class="p-2 text-red-400"><i data-lucide="log-out"></i></button></div>
  </header>
  <div id="apStories"></div>
  <nav class="flex border-b border-gray-800">
   <button id="tabChatsBtn" onclick="switchTab('chats')" class="flex-1 p-3 text-sm font-bold text-blue-400">Chats</button>
   <button id="tabRequestsBtn" onclick="switchTab('requests')" class="flex-1 p-3 text-sm text-gray-400">Requests</button>
   <button id="tabPeopleBtn" onclick="switchTab('people')" class="flex-1 p-3 text-sm text-gray-400">Discover</button>
  </nav>
  <div class="p-3 border-b border-gray-800"><input id="searchInput" oninput="renderUI()" placeholder="Search name or @APCHAT ID..." class="w-full bg-gray-800 rounded-xl p-3 text-sm"></div>
  <div id="chatsView" class="flex-1 overflow-y-auto"></div>
  <div id="requestsView" class="flex-1 overflow-y-auto hidden p-3"><h3 class="text-xs text-gray-400 font-bold mb-2">FRIEND REQUESTS</h3><div id="friendRequestsList" class="space-y-2"></div></div>
  <div id="peopleView" class="flex-1 overflow-y-auto hidden p-3 space-y-2"></div>
 </aside>
 <main id="chatArea" class="hidden flex-1 flex-col bg-gray-950 h-full">
  <div id="emptyChatState" class="flex-1 flex flex-col items-center justify-center text-center p-5"><div class="w-20 h-20 rounded-full brand flex items-center justify-center text-3xl font-black mb-4">AP</div><h2 class="text-xl font-bold">Welcome to APCHAT</h2><p class="text-sm text-gray-400 mt-2">Select a friend to start messaging.</p></div>
  <div id="activeChatInterface" class="hidden flex-1 flex-col h-full">
   <header class="p-3 bg-gray-900 border-b border-gray-800 flex items-center gap-3"><button onclick="closeChat()" class="p-2"><i data-lucide="arrow-left"></i></button><img id="activeChatAvatar" class="w-10 h-10 rounded-full object-cover" alt=""><div class="min-w-0"><h2 id="activeChatName" class="font-bold truncate"></h2><p id="activeChatBio" class="text-xs text-gray-400"></p></div></header>
   <div id="messagesContainer" class="flex-1 overflow-y-auto p-4 space-y-3"></div>
   <footer class="p-3 bg-gray-900 border-t border-gray-800 flex gap-2"><input id="messageInput" onkeydown="handleKeyPress(event)" placeholder="Type a message..." class="flex-1 bg-gray-800 rounded-full px-4 py-3 text-sm"><button onclick="sendMessage()" class="w-12 h-12 brand rounded-full flex items-center justify-center"><i data-lucide="send"></i></button></footer>
  </div>
 </main>
</section>
<div id="privacyModal" class="hidden fixed inset-0 bg-black/70 z-50 flex items-center justify-center p-4"><div class="bg-gray-900 border border-gray-700 rounded-2xl p-6 w-full max-w-sm space-y-3">
 <h3 class="font-bold text-lg">Account Settings</h3><label class="text-xs text-gray-400">Account privacy</label><select id="privacySelect" class="w-full bg-gray-800 p-3 rounded-xl text-sm"><option value="public">Public</option><option value="private">Private</option></select>
 <div class="flex justify-end gap-2"><button onclick="closePrivacyModal()" class="px-4 py-2 bg-gray-700 rounded-lg text-sm">Cancel</button><button onclick="savePrivacySettings()" class="px-4 py-2 brand rounded-lg text-sm">Save</button></div>
 </div></div>
<input id="photoInput" type="file" accept="image/*" hidden onchange="uploadPhoto(this.files[0])">
<input id="storyInput" type="file" accept="image/*" hidden onchange="uploadStory(this.files[0])">
<script>
const firebaseConfig={
 apiKey:"AIzaSyD7ZgOGN87vLRu0-BKaAm5e5c8CKbFWiYs",
 authDomain:"apchat-app.firebaseapp.com",
 databaseURL:"https://apchat-app-default-rtdb.firebaseio.com",
 projectId:"apchat-app",
 storageBucket:"apchat-app.firebasestorage.app",
 messagingSenderId:"1089476474245",
 appId:"1:1089476474245:web:ac8fc99012b09ad58540ec",
 measurementId:"G-5H1JWCGWN8"
};
firebase.initializeApp(firebaseConfig);
const auth=firebase.auth(),db=firebase.database();
const $=id=>document.getElementById(id);
const fallback='https://ui-avatars.com/api/?background=1d4ed8&color=fff&name=AP';
let currentUser=null,activeChatUserId=null,allUsers={},friendships={},incomingRequests={},blockedUsers={},chatListeners=[],listenersStarted=false,registrationInProgress=false;
function status(t){$('authStatus').textContent=t||''}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function cleanPhone(v){let d=String(v).replace(/\D/g,'');if(d.startsWith('880')&&d.length===13)d='0'+d.slice(3);return d}
function phoneEmail(v){return cleanPhone(v)+'@apchat-login.com'}
function cleanHandle(v){return String(v).trim().replace(/^@/,'').toLowerCase()}
function switchAuthView(v){$('viewLogin').classList.toggle('hidden',v!=='login');$('viewRegister').classList.toggle('hidden',v!=='register');status('')}
function icons(){if(window.lucide)lucide.createIcons()}
function showAuth(){$('app').classList.add('hidden');$('authScreen').classList.remove('hidden')}
function showApp(){
 $('authScreen').classList.add('hidden');$('app').classList.remove('hidden');
 $('currentUserNameDisplay').textContent=(currentUser.name||'User')+' · @'+currentUser.handle;
 $('myAvatar').src=currentUser.avatar||fallback;
 if(innerWidth>=700){$('chatArea').classList.remove('hidden');$('chatArea').classList.add('flex')}
 startListeners();renderUI();loadStories();icons();
}
function authError(e){
 const m={'auth/email-already-in-use':'এই ফোন নম্বরে অ্যাকাউন্ট আছে।','auth/invalid-email':'ফোন নম্বর সঠিক নয়।','auth/weak-password':'পাসওয়ার্ড কমপক্ষে ৬ অক্ষরের হতে হবে।','auth/user-not-found':'অ্যাকাউন্ট পাওয়া যায়নি।','auth/wrong-password':'ফোন নম্বর বা পাসওয়ার্ড ভুল।','auth/invalid-credential':'ফোন নম্বর বা পাসওয়ার্ড ভুল।','auth/invalid-login-credentials':'ফোন নম্বর বা পাসওয়ার্ড ভুল।','auth/network-request-failed':'ইন্টারনেট সংযোগ পরীক্ষা করুন।'};
 return m[e.code]||e.message||'সমস্যা হয়েছে।';
}
async function handleRegister(){
 if(registrationInProgress)return;
 const name=$('regName').value.trim(),handle=cleanHandle($('regHandle').value),phone=cleanPhone($('regPhone').value),password=$('regPassword').value,privacy=$('regPrivacy').value;
 if(!name||!handle||!phone||!password)return status('সব ঘর পূরণ করুন।');
 if(!/^[a-z0-9_]{3,24}$/.test(handle))return status('APCHAT ID ৩-২৪ অক্ষর: ইংরেজি, সংখ্যা বা _ দিন।');
 if(phone.length<7||phone.length>15)return status('সঠিক ফোন নম্বর দিন।');
 if(password.length<6)return status('পাসওয়ার্ড কমপক্ষে ৬ অক্ষরের হতে হবে।');
 registrationInProgress=true;$('registerBtn').disabled=true;status('অ্যাকাউন্ট তৈরি হচ্ছে...');
 let cred=null,ref=null,reserved=false;
 try{
  cred=await auth.createUserWithEmailAndPassword(phoneEmail(phone),password);
  ref=db.ref('handles/'+handle);
  const tx=await ref.transaction(v=>v===null?cred.user.uid:undefined);
  if(!tx.committed)throw new Error('এই APCHAT ID আগে থেকেই ব্যবহৃত হচ্ছে।');
  reserved=true;
  const profile={uid:cred.user.uid,name,handle,privacy,avatar:'',bio:'Using APCHAT',createdAt:firebase.database.ServerValue.TIMESTAMP};
  await db.ref('profiles/'+cred.user.uid).set(profile);
  currentUser=profile;registrationInProgress=false;showApp();status('');
 }catch(e){
  if(reserved&&ref){try{await ref.remove()}catch(x){console.error(x)}}
  if(cred&&cred.user){try{await cred.user.delete()}catch(x){try{await auth.signOut()}catch(y){console.error(y)}}}
  currentUser=null;showAuth();status(e.message.includes('APCHAT ID')?e.message:authError(e));
 }finally{registrationInProgress=false;$('registerBtn').disabled=false}
}
async function handleLogin(){
 const phone=cleanPhone($('loginPhone').value),password=$('loginPassword').value;
 if(!phone||!password)return status('ফোন নম্বর ও পাসওয়ার্ড দিন।');
 $('loginBtn').disabled=true;status('লগইন হচ্ছে...');
 try{await auth.signInWithEmailAndPassword(phoneEmail(phone),password)}catch(e){status(authError(e))}finally{$('loginBtn').disabled=false}
}
async function logout(){if(!confirm('লগআউট করবেন?'))return;stopListeners();await auth.signOut()}
function stopListeners(){
 if(!currentUser)return;
 ['profiles','friends/'+currentUser.uid,'friendRequests/'+currentUser.uid,'blocked/'+currentUser.uid].forEach(p=>db.ref(p).off());
 chatListeners.forEach(x=>db.ref(x.path).off('value',x.cb));chatListeners=[];listenersStarted=false;
}
function startListeners(){
 if(!currentUser||listenersStarted)return;listenersStarted=true;
 db.ref('profiles').on('value',s=>{allUsers=s.val()||{};renderUI()});
 db.ref('friends/'+currentUser.uid).on('value',s=>{friendships=s.val()||{};renderUI()});
 db.ref('friendRequests/'+currentUser.uid).on('value',s=>{incomingRequests=s.val()||{};renderUI()});
 db.ref('blocked/'+currentUser.uid).on('value',s=>{blockedUsers=s.val()||{};renderUI()});
}
function switchTab(t){
 ['chats','requests','people'].forEach(n=>{$(n+'View').classList.toggle('hidden',n!==t);const b=$('tab'+n[0].toUpperCase()+n.slice(1)+'Btn');b.classList.toggle('text-blue-400',n===t);b.classList.toggle('text-gray-400',n!==t)});
}
function renderUI(){
 if(!currentUser)return;
 const chats=$('chatsView'),req=$('friendRequestsList'),people=$('peopleView');chats.innerHTML='';req.innerHTML='';people.innerHTML='';
 const q=$('searchInput').value.trim().toLowerCase().replace(/^@/,'');
 Object.values(allUsers).forEach(u=>{
  if(!u||!u.uid||u.uid===currentUser.uid||blockedUsers[u.uid])return;
  const n=String(u.name||''),h=String(u.handle||'');if(q&&!n.toLowerCase().includes(q)&&!h.toLowerCase().includes(q))return;
  const id=esc(u.uid),av=esc(u.avatar||fallback),nm=esc(n),hh=esc(h);
  if(friendships[u.uid]==='accepted'){
   chats.innerHTML+=`<button onclick="openChat('${id}')" class="w-full text-left flex items-center gap-3 p-3 border-b border-gray-800"><img src="${av}" class="w-11 h-11 rounded-full object-cover"><span><b class="block text-sm">${nm}</b><small class="text-gray-400">@${hh}</small></span></button>`;
  }else if(incomingRequests[u.uid]){
   req.innerHTML+=`<div class="flex justify-between items-center gap-2 p-3 bg-gray-800 rounded-xl"><span class="text-sm">${nm}<small class="block text-gray-400">@${hh}</small></span><button onclick="acceptFriendReq('${id}')" class="bg-green-600 px-3 py-2 rounded-lg text-xs">Accept</button></div>`;
  }else{
   const action=friendships[u.uid]==='sent'?'<small class="text-gray-400">Request Sent</small>':`<button onclick="sendFriendReq('${id}')" class="bg-blue-600 px-3 py-2 rounded-lg text-xs">Add Friend</button>`;
   people.innerHTML+=`<div class="flex items-center justify-between gap-2 p-3 bg-gray-800 rounded-xl"><span class="min-w-0"><b class="block text-sm truncate">${nm}</b><small class="text-gray-400">@${hh} · ${u.privacy==='private'?'Private':'Public'}</small></span>${action}</div>`;
  }
 });
 if(!req.innerHTML)req.innerHTML='<p class="text-xs text-gray-500">No friend requests.</p>';
 icons();
}
async function sendFriendReq(uid){
 try{await db.ref('friendRequests/'+uid+'/'+currentUser.uid).set({from:currentUser.uid,status:'pending',createdAt:Date.now()});await db.ref('friends/'+currentUser.uid+'/'+uid).set('sent');alert('Friend request sent')}catch(e){alert('Request failed: '+e.message)}
}
async function acceptFriendReq(uid){
 try{const u={};u['friends/'+currentUser.uid+'/'+uid]='accepted';u['friends/'+uid+'/'+currentUser.uid]='accepted';u['friendRequests/'+currentUser.uid+'/'+uid]=null;await db.ref().update(u)}catch(e){alert(e.message)}
}
function openChat(uid){
 if(friendships[uid]!=='accepted')return alert('আগে Friend Request গ্রহণ করতে হবে।');
 const u=allUsers[uid];if(!u)return;activeChatUserId=uid;
 $('chatArea').classList.remove('hidden');$('chatArea').classList.add('flex');$('emptyChatState').classList.add('hidden');$('activeChatInterface').classList.remove('hidden');$('activeChatInterface').classList.add('flex');
 $('activeChatAvatar').src=u.avatar||fallback;$('activeChatName').textContent=u.name||'User';$('activeChatBio').textContent='@'+u.handle;loadMessages();icons();
}
function path(a,b){return 'chats/'+a+'/'+b}
function closeChat(){chatListeners.forEach(x=>db.ref(x.path).off('value',x.cb));chatListeners=[];activeChatUserId=null;$('activeChatInterface').classList.add('hidden');$('emptyChatState').classList.remove('hidden');if(innerWidth<700){$('chatArea').classList.add('hidden');$('chatArea').classList.remove('flex')}}
function loadMessages(){
 chatListeners.forEach(x=>db.ref(x.path).off('value',x.cb));chatListeners=[];
 const records={},box=$('messagesContainer');box.innerHTML='';
 const draw=()=>{box.innerHTML='';Object.values(records).sort((a,b)=>(a.createdAt||0)-(b.createdAt||0)).forEach(m=>{
  const row=document.createElement('div');row.className=m.sender===currentUser.uid?'flex justify-end':'flex justify-start';
  const bubble=document.createElement('div');bubble.className=(m.sender===currentUser.uid?'bg-blue-600':'bg-gray-800')+' max-w-[82%] rounded-2xl p-3 text-white';
  const p=document.createElement('p');p.className='text-sm whitespace-pre-wrap break-words';p.textContent=m.text||'';
  const t=document.createElement('small');t.className='block text-right opacity-60 mt-1';t.textContent=m.time||'';bubble.append(p,t);row.append(bubble);box.append(row);
 });box.scrollTop=box.scrollHeight};
 [path(currentUser.uid,activeChatUserId),path(activeChatUserId,currentUser.uid)].forEach(p=>{const cb=s=>{Object.entries(s.val()||{}).forEach(([k,v])=>records[k]=v);draw()};db.ref(p).on('value',cb);chatListeners.push({path:p,cb})});
}
async function sendMessage(){
 const input=$('messageInput'),txt=input.value.trim();if(!txt||!activeChatUserId)return;if(txt.length>4000)return alert('Message is too long.');
 try{const key=db.ref().child('messageKey').push().key,m={sender:currentUser.uid,text:txt,time:new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}),createdAt:Date.now()},u={};u[path(currentUser.uid,activeChatUserId)+'/'+key]=m;u[path(activeChatUserId,currentUser.uid)+'/'+key]=m;await db.ref().update(u);input.value=''}catch(e){alert('Message failed: '+e.message)}
}
function handleKeyPress(e){if(e.key==='Enter')sendMessage()}
function togglePrivacySettings(){$('privacySelect').value=currentUser.privacy||'public';$('privacyModal').classList.remove('hidden')}
function closePrivacyModal(){$('privacyModal').classList.add('hidden')}
async function savePrivacySettings(){const v=$('privacySelect').value;try{await db.ref('profiles/'+currentUser.uid+'/privacy').set(v);currentUser.privacy=v;closePrivacyModal();alert('Privacy updated')}catch(e){alert('Save failed: '+e.message)}}
function chooseProfilePhoto(){$('photoInput').click()}
function compressImage(file,max=700){
 return new Promise((resolve,reject)=>{if(!file||!file.type.startsWith('image/'))return reject(Error('একটি ছবি নির্বাচন করুন।'));const r=new FileReader();r.onerror=reject;r.onload=()=>{const im=new Image();im.onerror=reject;im.onload=()=>{const scale=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*scale);c.height=Math.round(im.height*scale);c.getContext('2d').drawImage(im,0,0,c.width,c.height);resolve(c.toDataURL('image/jpeg',.65))};im.src=r.result};r.readAsDataURL(file)});
}
async function uploadPhoto(file){try{const data=await compressImage(file,500);await db.ref('profiles/'+currentUser.uid+'/avatar').set(data);currentUser.avatar=data;$('myAvatar').src=data;renderUI();alert('Profile photo updated')}catch(e){alert('ছবি আপলোড হয়নি: '+e.message)}$('photoInput').value=''}
async function uploadStory(file){
 try{
  const data=await compressImage(file,700),mode=prompt('Story privacy লিখুন: public / friends / custom / hide','friends');if(!mode)return;
  const privacy=mode.trim().toLowerCase();if(!['public','friends','custom','hide'].includes(privacy))return alert('সঠিক অপশন দিন।');
  let handles='';if(privacy==='custom'||privacy==='hide')handles=prompt('APCHAT ID লিখুন (কমা দিয়ে আলাদা করুন, @ ছাড়া):','')||'';
  const ref=db.ref('stories/'+currentUser.uid).push();
  await ref.set({image:data,name:currentUser.name,handle:currentUser.handle,privacy,handles:handles.split(',').map(x=>cleanHandle(x)).filter(Boolean),createdAt:Date.now(),expiresAt:Date.now()+86400000});
  alert('Story posted');loadStories();
 }catch(e){alert('Story পোস্ট হয়নি: '+e.message)}$('storyInput').value='';
}
async function loadStories(){
 const bar=$('apStories');if(!bar||!currentUser)return;bar.innerHTML='';
 const add=document.createElement('button');add.className='apStory';add.innerHTML='<span style="display:block;font-size:30px">＋</span>Add Story';add.onclick=()=>$('storyInput').click();bar.append(add);
 try{
  const snap=await db.ref('stories').once('value'),data=snap.val()||{},now=Date.now();
  for(const [uid,items] of Object.entries(data)){
   for(const [id,s] of Object.entries(items||{})){
    if(!s||!s.image||!s.expiresAt||s.expiresAt<now){db.ref('stories/'+uid+'/'+id).remove();continue}
    if(uid!==currentUser.uid&&!canSeeStory(uid,s))continue;
    const b=document.createElement('button');b.className='apStory';const im=document.createElement('img');im.src=s.image;const label=document.createElement('span');label.className='block truncate';label.textContent=s.name||'User';b.append(im,label);b.onclick=()=>viewStory(s);bar.append(b);
   }
  }
 }catch(e){console.error('Stories load error',e)}
}
function canSeeStory(uid,s){
 if(s.privacy==='public'||!s.privacy)return true;
 const isFriend=friendships[uid]==='accepted';
 const ids=(s.handles||[]).map(cleanHandle),mine=cleanHandle(currentUser.handle);
 if(s.privacy==='friends')return isFriend;
 if(s.privacy==='custom')return ids.includes(mine);
 if(s.privacy==='hide')return !ids.includes(mine);
 return false;
}
function viewStory(s){
 let modal=$('storyModal');if(!modal){modal=document.createElement('div');modal.id='storyModal';modal.onclick=()=>modal.remove();document.body.append(modal)}
 modal.innerHTML='';const card=document.createElement('div');card.className='text-center';const title=document.createElement('p');title.className='mb-3';title.textContent=(s.name||'User')+' · @'+(s.handle||'');const im=document.createElement('img');im.src=s.image;const note=document.createElement('p');note.className='text-xs text-gray-400 mt-3';note.textContent='Tap to close';card.append(title,im,note);modal.append(card);
}
auth.onAuthStateChanged(async user=>{
 if(registrationInProgress)return;
 if(!user){currentUser=null;allUsers={};friendships={};incomingRequests={};blockedUsers={};listenersStarted=false;showAuth();return}
 try{const s=await db.ref('profiles/'+user.uid).once('value');if(!s.exists()){await auth.signOut();status('Profile পাওয়া যায়নি। প্রয়োজনে আবার Register করুন।');return}currentUser=s.val();showApp()}
 catch(e){status('Profile load failed: '+e.message);await auth.signOut()}
});
window.addEventListener('load',()=>{icons();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(console.error)});
window.addEventListener('focus',()=>{if(currentUser)loadStories()});
</script>
</body>
</html>
