<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#030712">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <title>APCHAT - Global Messenger</title>
  <link rel="manifest" href="./manifest.json">

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>

  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #030712;
      color: #f9fafb;
      font-family: Inter, Arial, sans-serif;
      height: 100dvh;
      overflow: hidden;
      -webkit-tap-highlight-color: transparent;
    }
    .hidden { display: none !important; }
    button { cursor: pointer; }
    input, select { outline: none; }
    .brand {
      background: linear-gradient(120deg,#2563eb,#7c3aed);
    }
    .screen {
      height: 100dvh;
      width: 100%;
      overflow: hidden;
    }
    #app {
      height: 100dvh;
      width: 100%;
    }
    #sidebar {
      width: 100%;
      max-width: 420px;
    }
    @media (min-width: 700px) {
      #sidebar { width: 340px; }
    }
  </style>

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              500: '#2563eb',
              600: '#1d4ed8',
              accent: '#7c3aed'
            }
          }
        }
      }
    };
  </script>
</head>

<body class="bg-gray-950 text-gray-100">

  <!-- AUTHENTICATION -->
  <section id="authScreen"
    class="screen flex items-center justify-center p-4 bg-gray-950">

    <div class="w-full max-w-md bg-gray-900 border border-gray-800 rounded-3xl p-6 shadow-2xl">

      <div class="text-center mb-7">
        <div class="w-16 h-16 rounded-2xl brand flex items-center justify-center text-white text-3xl font-black mx-auto mb-4">
          AP
        </div>
        <h1 class="text-3xl font-black text-blue-500">APCHAT</h1>
        <p class="text-xs text-gray-400 mt-1">
          Global Real-Time Messenger
        </p>
      </div>

      <div id="viewLogin" class="space-y-4">
        <h2 class="text-xl font-bold text-center">Login</h2>

        <div>
          <label class="text-xs text-gray-400">Mobile Number</label>
          <input id="loginPhone" type="tel"
            placeholder="01700000000"
            class="w-full mt-1 bg-gray-800 p-3 rounded-xl text-sm">
        </div>

        <div>
          <label class="text-xs text-gray-400">Password</label>
          <input id="loginPassword" type="password"
            placeholder="Password"
            class="w-full mt-1 bg-gray-800 p-3 rounded-xl text-sm">
        </div>

        <button onclick="handleLogin()"
          class="w-full py-3 brand rounded-xl font-bold">
          Login
        </button>

        <p class="text-center text-sm text-gray-400">
          Don't have an account?
          <button onclick="switchAuthView('register')"
            class="text-blue-400 font-bold underline">
            Create Account
          </button>
        </p>
      </div>

      <div id="viewRegister" class="space-y-3 hidden">
        <h2 class="text-xl font-bold text-center">Create Account</h2>

        <input id="regName" type="text"
          placeholder="Full Name"
          class="w-full bg-gray-800 p-3 rounded-xl text-sm">

        <input id="regPhone" type="tel"
          placeholder="Mobile Number"
          class="w-full bg-gray-800 p-3 rounded-xl text-sm">

        <input id="regPassword" type="password"
          placeholder="Password"
          class="w-full bg-gray-800 p-3 rounded-xl text-sm">

        <select id="regPrivacy"
          class="w-full bg-gray-800 p-3 rounded-xl text-sm">
          <option value="public">Public Account</option>
          <option value="private">Private Account</option>
        </select>

        <button onclick="handleRegister()"
          class="w-full py-3 brand rounded-xl font-bold">
          Register Account
        </button>

        <p class="text-center text-sm text-gray-400">
          Already have an account?
          <button onclick="switchAuthView('login')"
            class="text-blue-400 font-bold underline">
            Login
          </button>
        </p>
      </div>

      <p id="authStatus"
        class="text-center text-xs text-red-400 mt-4"></p>
    </div>
  </section>


  <!-- MAIN APP -->
  <section id="app" class="hidden flex bg-gray-950">

    <!-- SIDEBAR -->
    <aside id="sidebar"
      class="bg-gray-900 border-r border-gray-800 flex flex-col h-full">

      <header class="p-4 border-b border-gray-800 flex justify-between items-center">
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 rounded-xl brand flex items-center justify-center font-black text-xl">
            AP
          </div>
          <div>
            <h1 class="text-xl font-black text-blue-400">APCHAT</h1>
            <p id="currentUserNameDisplay"
              class="text-xs text-gray-400">Online</p>
          </div>
        </div>

        <div class="flex gap-2">
          <button onclick="togglePrivacySettings()"
            class="p-2 text-gray-300">
            <i data-lucide="settings"></i>
          </button>
          <button onclick="logout()"
            class="p-2 text-red-400">
            <i data-lucide="log-out"></i>
          </button>
        </div>
      </header>

      <!-- TABS -->
      <nav class="flex border-b border-gray-800">
        <button id="tabChatsBtn"
          onclick="switchTab('chats')"
          class="flex-1 p-3 text-sm font-bold text-blue-400">
          Chats
        </button>

        <button id="tabRequestsBtn"
          onclick="switchTab('requests')"
          class="flex-1 p-3 text-sm text-gray-400">
          Requests
        </button>

        <button id="tabPeopleBtn"
          onclick="switchTab('people')"
          class="flex-1 p-3 text-sm text-gray-400">
          Discover
        </button>
      </nav>

      <div class="p-3 border-b border-gray-800">
        <input id="searchInput"
          oninput="handleSearch()"
          placeholder="Search by name or number..."
          class="w-full bg-gray-800 rounded-xl p-3 text-sm">
      </div>

      <div id="chatsView"
        class="flex-1 overflow-y-auto"></div>

      <div id="requestsView"
        class="flex-1 overflow-y-auto hidden p-3 space-y-5">

        <div>
          <h3 class="text-xs text-gray-400 font-bold mb-2">
            FRIEND REQUESTS
          </h3>
          <div id="friendRequestsList"
            class="space-y-2"></div>
        </div>

        <div>
          <h3 class="text-xs text-gray-400 font-bold mb-2">
            MESSAGE REQUESTS
          </h3>
          <div id="messageRequestsList"
            class="space-y-2"></div>
        </div>
      </div>

      <div id="peopleView"
        class="flex-1 overflow-y-auto hidden p-3 space-y-2"></div>
    </aside>


    <!-- CHAT AREA -->
    <main id="chatArea"
      class="hidden flex-1 flex-col bg-gray-950 h-full">

      <div id="emptyChatState"
        class="flex-1 flex flex-col items-center justify-center text-center p-5">

        <div class="w-20 h-20 rounded-full brand flex items-center justify-center text-3xl font-black mb-4">
          AP
        </div>

        <h2 class="text-xl font-bold">Welcome to APCHAT</h2>
        <p class="text-sm text-gray-400 mt-2">
          Select a user to start messaging.
        </p>
      </div>

      <div id="activeChatInterface"
        class="hidden flex-1 flex-col h-full">

        <header class="p-3 bg-gray-900 border-b border-gray-800 flex items-center gap-3">

          <button onclick="closeChat()"
            class="p-2 text-gray-300">
            <i data-lucide="arrow-left"></i>
          </button>

          <img id="activeChatAvatar"
            src=""
            class="w-10 h-10 rounded-full object-cover">

          <div>
            <h2 id="activeChatName"
              class="font-bold"></h2>
            <p id="activeChatBio"
              class="text-xs text-gray-400"></p>
          </div>
        </header>

        <div id="requestBanner"
          class="hidden p-3 bg-blue-900 text-center">

          <p class="text-xs mb-2">
            <span id="requestSenderName"></span>
            sent you a message request.
          </p>

          <div class="flex justify-center gap-2">
            <button onclick="acceptMessageRequest()"
              class="bg-green-600 px-3 py-2 rounded-lg text-xs">
              Accept
            </button>

            <button onclick="deleteMessageRequest()"
              class="bg-gray-600 px-3 py-2 rounded-lg text-xs">
              Delete
            </button>

            <button onclick="blockUserFromRequest()"
              class="bg-red-600 px-3 py-2 rounded-lg text-xs">
              Block
            </button>
          </div>
        </div>

        <div id="messagesContainer"
          class="flex-1 overflow-y-auto p-4 space-y-3"></div>

        <footer id="chatFooter"
          class="p-3 bg-gray-900 border-t border-gray-800 flex gap-2">

          <input id="messageInput"
            onkeydown="handleKeyPress(event)"
            placeholder="Type a message..."
            class="flex-1 bg-gray-800 rounded-full px-4 py-3 text-sm">

          <button onclick="sendMessage()"
            class="w-12 h-12 brand rounded-full flex items-center justify-center">
            <i data-lucide="send"></i>
          </button>
        </footer>
      </div>
    </main>
  </section>


  <!-- PRIVACY SETTINGS -->
  <div id="privacyModal"
    class="hidden fixed inset-0 bg-black/70 z-50 flex items-center justify-center p-4">

    <div class="bg-gray-900 border border-gray-700 rounded-2xl p-6 w-full max-w-sm space-y-4">

      <h3 class="font-bold text-lg">Account Privacy Settings</h3>

      <label class="text-xs text-gray-400">
        Who can add you as a friend?
      </label>

      <select id="privacySelect"
        class="w-full bg-gray-800 p-3 rounded-xl text-sm">
        <option value="public">Public</option>
        <option value="private">Private</option>
      </select>

      <div class="flex justify-end gap-2">
        <button onclick="closePrivacyModal()"
          class="px-4 py-2 bg-gray-700 rounded-lg text-sm">
          Cancel
        </button>

        <button onclick="savePrivacySettings()"
          class="px-4 py-2 brand rounded-lg text-sm">
          Save
        </button>
      </div>
    </div>
  </div>


  <!-- APPLICATION LOGIC -->
  <script>
    // FIREBASE CONFIGURATION
    const firebaseConfig = {
      apiKey: "AIzaSyD7ZgOGN87vLRu0-BKaAm5e5c8CKbFWiYs",
      authDomain: "apchat-app.firebaseapp.com",
      projectId: "apchat-app",
      storageBucket: "apchat-app.firebasestorage.app",
      messagingSenderId: "1089476474245",
      appId: "1:1089476474245:web:ac8fc99012b09ad58540ec",
      measurementId: "G-5H1JWCGWN8"
    };

    let db;
    let currentUser = null;
    let activeChatUserId = null;

    let allUsers = {};
    let friendships = {};
    let msgRequests = {};
    let blockedUsers = {};

    let chatListener = null;

    function showStatus(message) {
      document.getElementById('authStatus').textContent = message;
    }

    function escapeHTML(value) {
      return String(value ?? '').replace(/[&<>"']/g, c => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;'
      }[c]));
    }

    function initFirebase() {
      try {
        if (!firebase.apps.length) {
          firebase.initializeApp(firebaseConfig);
        }
        db = firebase.database();
      } catch (error) {
        console.error(error);
        showStatus('Firebase connection failed. Please reload.');
      }
    }

    function switchAuthView(view) {
      document.getElementById('viewLogin')
        .classList.toggle('hidden', view !== 'login');

      document.getElementById('viewRegister')
        .classList.toggle('hidden', view !== 'register');

      showStatus('');
    }

    function showApp() {
      document.getElementById('authScreen').classList.add('hidden');
      document.getElementById('app').classList.remove('hidden');

      document.getElementById('currentUserNameDisplay').textContent =
        currentUser.name || 'Online';

      if (window.innerWidth >= 700) {
        document.getElementById('chatArea').classList.remove('hidden');
        document.getElementById('chatArea').classList.add('flex');
      }

      initRealtimeListeners();
      refreshIcons();
    }

    function showAuth() {
      document.getElementById('app').classList.add('hidden');
      document.getElementById('authScreen').classList.remove('hidden');
    }

    async function handleRegister() {
      const name = document.getElementById('regName').value.trim();
      const phone = document.getElementById('regPhone').value.trim();
      const password = document.getElementById('regPassword').value.trim();
      const privacy = document.getElementById('regPrivacy').value;

      if (!name || !phone || !password) {
        return showStatus('Please fill in all fields.');
      }

      if (password.length < 6) {
        return showStatus('Password must be at least 6 characters.');
      }

      const userId = 'usr_' + phone.replace(/[^0-9]/g, '');

      try {
        const snapshot = await db.ref('users/' + userId).once('value');

        if (snapshot.exists()) {
          return showStatus('This phone number is already registered.');
        }

        const userData = {
          id: userId,
          name: name,
          phone: phone,
          password: password,
          avatar: 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=150&q=80',
          privacy: privacy,
          bio: 'Using APCHAT'
        };

        await db.ref('users/' + userId).set(userData);

        currentUser = userData;
        localStorage.setItem('apchat_active_user', JSON.stringify(currentUser));

        showApp();

      } catch (error) {
        console.error(error);
        showStatus('Registration failed. Check Firebase settings.');
      }
    }

    async function handleLogin() {
      const phone = document.getElementById('loginPhone').value.trim();
      const password = document.getElementById('loginPassword').value.trim();

      if (!phone || !password) {
        return showStatus('Enter phone number and password.');
      }

      const userId = 'usr_' + phone.replace(/[^0-9]/g, '');

      try {
        const snapshot = await db.ref('users/' + userId).once('value');
        const user = snapshot.val();

        if (user && user.password === password) {
          currentUser = user;
          localStorage.setItem('apchat_active_user', JSON.stringify(currentUser));
          showApp();
        } else {
          showStatus('Invalid phone number or password.');
        }

      } catch (error) {
        console.error(error);
        showStatus('Login failed. Check your internet or Firebase settings.');
      }
    }

    function logout() {
      if (!confirm('Are you sure you want to logout?')) return;

      localStorage.removeItem('apchat_active_user');
      currentUser = null;
      location.reload();
    }

    function initRealtimeListeners() {
      if (!currentUser || !db) return;

      db.ref('users').on('value', snapshot => {
        allUsers = snapshot.val() || {};
        renderUI();
      });

      db.ref('friendships/' + currentUser.id).on('value', snapshot => {
        friendships = snapshot.val() || {};
        renderUI();
      });

      db.ref('msg_requests/' + currentUser.id).on('value', snapshot => {
        msgRequests = snapshot.val() || {};
        renderUI();
      });

      db.ref('blocked/' + currentUser.id).on('value', snapshot => {
        blockedUsers = snapshot.val() || {};
        renderUI();
      });
    }

    function switchTab(tab) {
      const tabs = ['chats', 'requests', 'people'];

      tabs.forEach(name => {
        document.getElementById(name + 'View')
          .classList.toggle('hidden', name !== tab);

        const button = document.getElementById(
          'tab' + name.charAt(0).toUpperCase() + name.slice(1) + 'Btn'
        );

        button.classList.toggle('text-blue-400', name === tab);
        button.classList.toggle('text-gray-400', name !== tab);
      });
    }

    function renderUI() {
      if (!currentUser) return;

      const chatsList = document.getElementById('chatsView');
      const friendReqList = document.getElementById('friendRequestsList');
      const msgReqList = document.getElementById('messageRequestsList');
      const peopleList = document.getElementById('peopleView');

      chatsList.innerHTML = '';
      friendReqList.innerHTML = '';
      msgReqList.innerHTML = '';
      peopleList.innerHTML = '';

      const query = document.getElementById('searchInput').value.toLowerCase();

      Object.values(allUsers).forEach(user => {
        if (!user || !user.id || user.id === currentUser.id) return;
        if (blockedUsers[user.id]) return;

        const name = String(user.name || '');
        const phone = String(user.phone || '');

        if (query &&
          !name.toLowerCase().includes(query) &&
          !phone.includes(query)) return;

        const relation = friendships[user.id];
        const messageRequest = msgRequests[user.id];

        const safeId = escapeHTML(user.id);
        const safeName = escapeHTML(name);
        const safeAvatar = escapeHTML(user.avatar || '');

        if (relation === 'accepted') {
          chatsList.innerHTML += `
            <div onclick="openChat('${safeId}')"
              class="flex items-center gap-3 p-3 cursor-pointer border-b border-gray-800">
              <img src="${safeAvatar}" class="w-11 h-11 rounded-full object-cover">
              <div>
                <h4 class="font-semibold text-sm">${safeName}</h4>
                <span class="text-xs text-gray-400">Friend</span>
              </div>
            </div>`;
        } else if (relation === 'received') {
          friendReqList.innerHTML += `
            <div class="flex justify-between items-center p-3 bg-gray-800 rounded-xl">
              <span class="text-sm">${safeName}</span>
              <button onclick="acceptFriendReq('${safeId}')"
                class="bg-green-600 px-3 py-2 rounded-lg text-xs">
                Accept
              </button>
            </div>`;
        } else if (messageRequest === 'pending') {
          msgReqList.innerHTML += `
            <div onclick="openChat('${safeId}')"
              class="p-3 bg-gray-800 rounded-xl cursor-pointer text-sm">
              ${safeName} — Message Request
            </div>`;
        } else {
          let action = '';

          if (user.privacy === 'public') {
            action = `<button onclick="sendFriendReq('${safeId}')"
              class="bg-blue-600 px-3 py-2 rounded-lg text-xs">
              Add Friend
            </button>`;
          } else {
            action = `<button onclick="openChat('${safeId}')"
              class="bg-gray-700 px-3 py-2 rounded-lg text-xs">
              Message Request
            </button>`;
          }

          if (relation === 'sent') {
            action = '<span class="text-xs text-gray-400">Request Sent</span>';
          }

          peopleList.innerHTML += `
            <div class="flex items-center justify-between gap-2 p-3 bg-gray-800 rounded-xl">
              <div class="flex items-center gap-2 min-w-0">
                <img src="${safeAvatar}" class="w-9 h-9 rounded-full object-cover">
                <div class="min-w-0">
                  <h4 class="text-sm font-bold truncate">${safeName}</h4>
                  <span class="text-xs text-gray-400">
                    ${user.privacy === 'private' ? 'Private Profile' : 'Public'}
                  </span>
                </div>
              </div>
              ${action}
            </div>`;
        }
      });

      refreshIcons();
    }

    function handleSearch() {
      renderUI();
    }

    async function sendFriendReq(id) {
      try {
        await db.ref(`friendships/${currentUser.id}/${id}`).set('sent');
        await db.ref(`friendships/${id}/${currentUser.id}`).set('received');
        alert('Friend Request Sent!');
      } catch (error) {
        alert('Could not send friend request.');
        console.error(error);
      }
    }

    async function acceptFriendReq(id) {
      try {
        await db.ref(`friendships/${currentUser.id}/${id}`).set('accepted');
        await db.ref(`friendships/${id}/${currentUser.id}`).set('accepted');
      } catch (error) {
        alert('Could not accept request.');
        console.error(error);
      }
    }

    function openChat(id) {
      const user = allUsers[id];
      if (!user) return;

      activeChatUserId = id;

      document.getElementById('chatArea').classList.remove('hidden');
      document.getElementById('chatArea').classList.add('flex');

      document.getElementById('emptyChatState').classList.add('hidden');

      const chat = document.getElementById('activeChatInterface');
      chat.classList.remove('hidden');
      chat.classList.add('flex');

      document.getElementById('activeChatAvatar').src = user.avatar || '';
      document.getElementById('activeChatName').textContent = user.name || '';
      document.getElementById('activeChatBio').textContent =
        user.privacy === 'private' ? 'Private Account' : 'Public Account';

      const isRequest = msgRequests[id] === 'pending';

      document.getElementById('requestBanner')
        .classList.toggle('hidden', !isRequest);

      document.getElementById('requestSenderName').textContent =
        user.name || 'User';

      loadMessages();
      refreshIcons();
    }

    function closeChat() {
      activeChatUserId = null;

      document.getElementById('activeChatInterface').classList.add('hidden');
      document.getElementById('emptyChatState').classList.remove('hidden');

      if (chatListener && db) {
        const chatId = [currentUser.id, chatListener.userId].sort().join('_');
        db.ref('chats/' + chatId).off('value', chatListener.callback);
        chatListener = null;
      }
    }

    function loadMessages() {
      const container = document.getElementById('messagesContainer');
      const chatId = [currentUser.id, activeChatUserId].sort().join('_');

      if (chatListener) {
        const oldId = [currentUser.id, chatListener.userId].sort().join('_');
        db.ref('chats/' + oldId).off('value', chatListener.callback);
      }

      const callback = snapshot => {
        container.innerHTML = '';

        const messages = snapshot.val() || {};

        Object.values(messages).forEach(message => {
          const isMe = message.sender === currentUser.id;

          const bubble = document.createElement('div');
          bubble.className = isMe ? 'flex justify-end' : 'flex justify-start';

          const content = document.createElement('div');
          content.className = isMe
            ? 'max-w-[80%] bg-blue-600 text-white rounded-2xl rounded-br-none p-3'
            : 'max-w-[80%] bg-gray-800 text-white rounded-2xl rounded-bl-none p-3';

          const text = document.createElement('p');
          text.className = 'text-sm whitespace-pre-wrap break-words';
          text.textContent = message.text || '';

          const time = document.createElement('span');
          time.className = 'text-xs block text-right opacity-60 mt-1';
          time.textContent = message.time || '';

          content.appendChild(text);
          content.appendChild(time);
          bubble.appendChild(content);
          container.appendChild(bubble);
        });

        container.scrollTop = container.scrollHeight;
      };

      db.ref('chats/' + chatId).on('value', callback);
      chatListener = { userId: activeChatUserId, callback: callback };
    }

    async function sendMessage() {
      const input = document.getElementById('messageInput');
      const messageText = input.value.trim();

      if (!messageText || !activeChatUserId) return;

      try {
        const targetUser = allUsers[activeChatUserId];
        const relation = friendships[activeChatUserId];

        if (targetUser &&
          targetUser.privacy === 'private' &&
          relation !== 'accepted') {
          await db.ref(
            `msg_requests/${activeChatUserId}/${currentUser.id}`
          ).set('pending');
        }

        const chatId = [currentUser.id, activeChatUserId].sort().join('_');

        await db.ref('chats/' + chatId).push({
          sender: currentUser.id,
          text: messageText,
          time: new Date().toLocaleTimeString([], {
            hour: '2-digit',
            minute: '2-digit'
          })
        });

        input.value = '';

      } catch (error) {
        alert('Message could not be sent.');
        console.error(error);
      }
    }

    async function acceptMessageRequest() {
      try {
        await db.ref(
          `msg_requests/${currentUser.id}/${activeChatUserId}`
        ).remove();

        await db.ref(
          `friendships/${currentUser.id}/${activeChatUserId}`
        ).set('accepted');

        await db.ref(
          `friendships/${activeChatUserId}/${currentUser.id}`
        ).set('accepted');

        document.getElementById('requestBanner').classList.add('hidden');
        alert('Message request accepted!');

      } catch (error) {
        alert('Could not accept message request.');
        console.error(error);
      }
    }

    async function deleteMessageRequest() {
      try {
        await db.ref(
          `msg_requests/${currentUser.id}/${activeChatUserId}`
        ).remove();

        document.getElementById('requestBanner').classList.add('hidden');
        alert('Message request deleted.');

      } catch (error) {
        alert('Could not delete request.');
        console.error(error);
      }
    }

    async function blockUserFromRequest() {
      try {
        await db.ref(
          `msg_requests/${currentUser.id}/${activeChatUserId}`
        ).remove();

        await db.ref(
          `blocked/${currentUser.id}/${activeChatUserId}`
        ).set(true);

        document.getElementById('requestBanner').classList.add('hidden');
        closeChat();

        alert('User blocked!');

      } catch (error) {
        alert('Could not block user.');
        console.error(error);
      }
    }

    function togglePrivacySettings() {
      document.getElementById('privacySelect').value =
        currentUser.privacy || 'public';

      document.getElementById('privacyModal')
        .classList.remove('hidden');
    }

    function closePrivacyModal() {
      document.getElementById('privacyModal')
        .classList.add('hidden');
    }

    async function savePrivacySettings() {
      const value = document.getElementById('privacySelect').value;

      try {
        await db.ref(`users/${currentUser.id}/privacy`).set(value);

        currentUser.privacy = value;

        localStorage.setItem(
          'apchat_active_user',
          JSON.stringify(currentUser)
        );

        closePrivacyModal();
        alert('Privacy settings updated!');

      } catch (error) {
        alert('Could not update privacy settings.');
        console.error(error);
      }
    }

    function handleKeyPress(event) {
      if (event.key === 'Enter') sendMessage();
    }

    function refreshIcons() {
      if (window.lucide) lucide.createIcons();
    }

    // APP STARTUP
    window.addEventListener('load', () => {
      initFirebase();

      try {
        const savedUser = localStorage.getItem('apchat_active_user');
        currentUser = savedUser ? JSON.parse(savedUser) : null;
      } catch (error) {
        currentUser = null;
        localStorage.removeItem('apchat_active_user');
      }

      if (currentUser && currentUser.id && db) {
        showApp();
      } else {
        showAuth();
      }

      refreshIcons();
    });

    // SERVICE WORKER FILE IS REGISTERED SEPARATELY
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .catch(error => console.error('Service Worker:', error));
      });
    }
  </script>
</body>
</html>
